#############################
### ENVIRONMENT VARIABLES ###
#############################

# See https://wiki.hyprland.org/Configuring/Environment-variables/
env = XCURSOR_THEME,QingyiBLZ
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
env = HYPRCURSOR_THEME,QingyiBLZ
# PATH (with ~/.local/bin) is set in configs/env.lua — keep this file free of machine paths
# env = PATH,$HOME/.local/bin:$PATH

# Nvidia compatibility settings
env = LIBVA_DRIVER_NAME,nvidia
env = __GLX_VENDOR_LIBRARY_NAME,nvidia


# Looking Glass shared memory settings for VM screen sharing
env = OMARCHY_LOOKING_GLASS,1
env = IVSHMEM_KEY,omarchy-win-vm

# Wayland environment settings
env = XDG_CURRENT_DESKTOP,Hyprland
env = SCREENSHOT_PROVIDER,ext-image-copy-capture-v1
